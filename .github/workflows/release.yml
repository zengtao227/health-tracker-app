name: Reproducible Android release

on:
  push:
    tags:
      - 'v*\+*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag to publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve immutable release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          if [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ]; then
            release_tag="$INPUT_TAG"
          else
            release_tag="$GITHUB_REF_NAME"
          fi
          [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned Android build tools
        run: |
          set -eu
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          "$sdkmanager" --install 'platforms;android-34' 'build-tools;34.0.0'

      - name: Verify release tag matches source version
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -eu
          version_name="$(sed -n 's/.*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts)"
          version_code="$(sed -n 's/.*versionCode = \([0-9][0-9]*\)/\1/p' app/build.gradle.kts)"
          test "$RELEASE_TAG" = "v${version_name}+${version_code}"
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$(git rev-parse HEAD)"

      - name: Test and build unsigned APK
        run: ./gradlew --no-daemon clean test assembleRelease

      - name: Align, sign, and verify APK
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.PHR_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.PHR_RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.PHR_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          set -eu
          set +x
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"

          build_tools="$ANDROID_HOME/build-tools/34.0.0"
          unsigned_apk='app/build/outputs/apk/release/app-release-unsigned.apk'
          aligned_apk="$RUNNER_TEMP/app-release-aligned.apk"
          keystore="$RUNNER_TEMP/personal-health-records-release.p12"
          version_name="$(sed -n 's/.*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts)"
          version_code="$(sed -n 's/.*versionCode = \([0-9][0-9]*\)/\1/p' app/build.gradle.kts)"
          signed_apk="$RUNNER_TEMP/PersonalHealthRecords-${version_name}-${version_code}.apk"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          "$build_tools/zipalign" -f -p 4 "$unsigned_apk" "$aligned_apk"
          "$build_tools/apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias personal-health-records \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$signed_apk" \
            "$aligned_apk"
          "$build_tools/apksigner" verify --verbose --print-certs "$signed_apk"
          sha256sum "$signed_apk"
          echo "apk=$signed_apk" >> "$GITHUB_OUTPUT"
          echo "asset_name=PersonalHealthRecords-${version_name}-${version_code}.apk" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_APK: ${{ steps.sign.outputs.apk }}
          RELEASE_ASSET_NAME: ${{ steps.sign.outputs.asset_name }}
        run: |
          set -eu
          version_code="$(sed -n 's/.*versionCode = \([0-9][0-9]*\)/\1/p' app/build.gradle.kts)"
          changelog="fastlane/metadata/android/en-US/changelogs/${version_code}.txt"
          test -f "$changelog"
          gh release create "$RELEASE_TAG" \
            "$RELEASE_APK#$RELEASE_ASSET_NAME" \
            --verify-tag \
            --title "Personal Health Records $RELEASE_TAG" \
            --notes-file "$changelog"

      - name: Remove temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/personal-health-records-release.p12"
