name: Mirror to GitLab

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Validate mirror secrets
        env:
          GITLAB_USERNAME: ${{ secrets.GITLAB_USERNAME }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_REPO: ${{ secrets.GITLAB_REPO }}
        run: |
          set -eu
          test -n "$GITLAB_USERNAME"
          test -n "$GITLAB_TOKEN"
          test -n "$GITLAB_REPO"
          echo "::add-mask::$GITLAB_TOKEN"

      - name: Configure GitLab remote
        env:
          GITLAB_REPO: ${{ secrets.GITLAB_REPO }}
        run: |
          set -eu
          git remote add gitlab "https://gitlab.com/${GITLAB_REPO}.git"

      - name: Mirror main branch
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          GITLAB_USERNAME: ${{ secrets.GITLAB_USERNAME }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          set -eu
          auth_header="$(printf '%s:%s' "$GITLAB_USERNAME" "$GITLAB_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraHeader="Authorization: Basic $auth_header" push gitlab refs/heads/main:refs/heads/main

      - name: Mirror tags
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITLAB_USERNAME: ${{ secrets.GITLAB_USERNAME }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          set -eu
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]
          git fetch --no-tags origin "refs/tags/${GITHUB_REF_NAME}:refs/fdroid-mirror-tag"
          auth_header="$(printf '%s:%s' "$GITLAB_USERNAME" "$GITLAB_TOKEN" | base64 | tr -d '\n')"
          git -c http.extraHeader="Authorization: Basic $auth_header" push gitlab "refs/fdroid-mirror-tag:refs/tags/${GITHUB_REF_NAME}"
